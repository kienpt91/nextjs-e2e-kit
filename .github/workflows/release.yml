name: release

# A push of a tag v* runs the whole CI (checks, the Playwright suite, the secret scan, the CI definitions), then archives the
# tagged commit, writes SHA256SUMS, attests where the file came from and creates the GitHub release. workflow_dispatch only
# runs the CI and keeps the archive as a workflow artifact; it never creates a release. Nothing is published anywhere else.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # the same file that runs on every push and pull request
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must name the manifest version and be in the history of the default branch
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-release-tag.sh "$TAG"

  release:
    needs: [verify, tag-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive the tagged commit and checksum it
        env:
          REF: ${{ github.sha }}
        run: |
          version=$(sh scripts/manifest-version.sh)
          mkdir release
          git archive --format=tar.gz --prefix="nextjs-e2e-kit-$version/" --output="release/nextjs-e2e-kit-$version.tar.gz" "$REF"
          cd release
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the build provenance of the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.txt"
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.txt" $flags release/*
      - name: Keep the archive (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: release/*
          if-no-files-found: error
          retention-days: 7
